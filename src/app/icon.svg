<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#1a73e8" />
    </linearGradient>
  </defs>

  <!-- Rounded App Background -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)" />
  <rect width="30" height="30" x="1" y="1" rx="7" fill="none" stroke="#334155" stroke-width="1" />

  <!-- Intelligent Central Processor / AI Core -->
  <rect x="10" y="10" width="12" height="12" rx="3" fill="url(#aiGrad)" />
  <circle cx="16" cy="16" r="2.5" fill="#ffffff" />

  <!-- Interconnected Agentic Pins / Neural Bus -->
  <!-- Top -->
  <line x1="13" y1="5" x2="13" y2="10" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" />
  <line x1="19" y1="5" x2="19" y2="10" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" />
  <!-- Bottom -->
  <line x1="13" y1="22" x2="13" y2="27" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" />
  <line x1="19" y1="22" x2="19" y2="27" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" />
  <!-- Left -->
  <line x1="5" y1="13" x2="10" y2="13" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" />
  <line x1="5" y1="19" x2="10" y2="19" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" />
  <!-- Right -->
  <line x1="22" y1="13" x2="27" y2="13" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" />
  <line x1="22" y1="19" x2="27" y2="19" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" />

  <!-- Active Emerald Signal Dot -->
  <circle cx="23" cy="9" r="1.5" fill="#10b981" />
</svg>
